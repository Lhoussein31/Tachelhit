<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conjugaison Tachelhit — Base de données exhaustive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bleu: #2c5f8d; --bleu-fonce: #1a3a56; --ocre: #c8862c;
    --gris: #333; --gris-clair: #e8e8e8; --gris-fonce: #555;
    --tifinagh-font: 'Noto Sans Tifinagh', 'Segoe UI', sans-serif;
  }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f0f2f5; color: var(--gris); line-height: 1.6;
    height: 100vh; display: flex; overflow: hidden;
  }

  /* ===== SIDEBAR ===== */
  #sidebar {
    width: 380px; min-width: 380px; background: white;
    border-right: 1px solid var(--gris-clair);
    display: flex; flex-direction: column; height: 100vh;
    box-shadow: 2px 0 8px rgba(0,0,0,0.05); z-index: 10;
  }
  .sidebar-header { padding: 1.2rem; background: var(--bleu); color: white; }
  .sidebar-header h2 { font-size: 1.1rem; margin-bottom: 0.2rem; }
  .sidebar-header p { font-size: 0.8rem; opacity: 0.85; }
  .search-box {
    padding: 0.8rem 1rem; border-bottom: 1px solid var(--gris-clair);
    background: #fafafa;
  }
  .search-box input {
    width: 100%; padding: 0.7rem 0.9rem; font-size: 0.95rem;
    border: 2px solid var(--gris-clair); border-radius: 8px;
    transition: border-color 0.2s;
  }
  .search-box input:focus { outline: none; border-color: var(--bleu); }
  #verbe-liste { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
  #verbe-liste::-webkit-scrollbar { width: 6px; }
  #verbe-liste::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  .verbe-item {
    padding: 0.7rem 1.2rem; cursor: pointer;
    border-bottom: 1px solid #f5f5f5; transition: background 0.15s;
    display: flex; flex-direction: column; gap: 0.15rem;
  }
  .verbe-item:hover { background: #f0f6ff; }
  .verbe-item.active {
    background: #e3f0ff; border-left: 4px solid var(--bleu); font-weight: 600;
  }
  .verbe-item .ligne-fr {
    font-size: 0.95rem; color: var(--bleu-fonce); font-weight: 600;
  }
  .verbe-item .ligne-latin { font-size: 0.85rem; color: var(--gris-fonce); }
  .verbe-item .ligne-tifinagh {
    font-family: var(--tifinagh-font); font-size: 0.9rem; color: var(--ocre);
  }
  .compteur {
    padding: 0.8rem 1.2rem; font-size: 0.8rem; color: #888;
    text-align: center; border-top: 1px solid var(--gris-clair); background: #fafafa;
  }

  /* ===== ZONE PRINCIPALE ===== */
  #contenu-principal { flex: 1; overflow-y: auto; padding: 2rem; height: 100vh; }
  .accueil {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; text-align: center; color: #999;
  }
  .accueil .icone { font-size: 4rem; margin-bottom: 1rem; }
  .accueil h2 { font-size: 1.4rem; color: var(--bleu-fonce); margin-bottom: 0.5rem; }
  .accueil p { max-width: 400px; }

  .carte-verbe { max-width: 1000px; margin: 0 auto; animation: apparition 0.25s ease; }
  @keyframes apparition {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .carte-verbe h1 {
    font-size: 1.8rem; color: var(--bleu-fonce); margin-bottom: 0.3rem;
    display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
  }
  .carte-verbe h1 .tifinagh-titre {
    font-family: var(--tifinagh-font); color: var(--ocre); font-size: 1.4rem;
  }
  .carte-verbe h1 .latin-titre {
    font-size: 1.1rem; color: var(--gris-fonce); font-weight: 400;
    font-style: italic;
  }
  .badge-groupe {
    background: var(--bleu); color: white; font-size: 0.75rem;
    padding: 0.2rem 0.8rem; border-radius: 20px; font-weight: normal;
  }
  .traductions-info {
    display: flex; flex-wrap: wrap; gap: 1rem;
    margin-bottom: 1.5rem; font-size: 0.9rem; color: var(--gris-fonce);
  }
  .traductions-info .bloc {
    background: #f9f6f0; padding: 0.4rem 0.8rem; border-radius: 6px;
    border-left: 3px solid var(--ocre);
  }
  .traductions-info .bloc strong { color: var(--bleu-fonce); }

  .onglets {
    display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem;
    border-bottom: 2px solid var(--gris-clair); padding-bottom: 0.5rem;
  }
  .onglet {
    padding: 0.5rem 1.2rem; border: none; background: transparent;
    cursor: pointer; font-size: 0.9rem; font-weight: 500;
    color: var(--gris-fonce); border-radius: 8px 8px 0 0;
    transition: all 0.2s;
  }
  .onglet:hover { background: #f0f6ff; color: var(--bleu); }
  .onglet.active { background: var(--bleu); color: white; }
  .onglet .abbr { font-size: 0.7rem; opacity: 0.7; display: block; }

  .tableau-conj {
    width: 100%; border-collapse: collapse; background: white;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 2rem;
  }
  .tableau-conj thead { background: var(--bleu-fonce); color: white; }
  .tableau-conj th {
    padding: 0.7rem 1rem; text-align: left;
    font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px;
  }
  .tableau-conj th:first-child { width: 28%; }
  .tableau-conj td {
    padding: 0.65rem 1rem; border-bottom: 1px solid var(--gris-clair);
    font-size: 0.95rem;
  }
  .tableau-conj tbody tr:last-child td { border-bottom: none; }
  .tableau-conj tbody tr:hover { background: #f9f6f0; }
  .tableau-conj td.personne {
    font-weight: 600; color: var(--bleu-fonce); font-size: 0.9rem;
  }
  .tableau-conj td.forme-latin { font-size: 1rem; color: var(--gris); }
  .tableau-conj td.forme-tifinagh {
    font-family: var(--tifinagh-font); font-size: 1.05rem; color: var(--ocre);
  }

  .message-erreur {
    background: #fdecea; border-left: 5px solid #c0392b;
    color: #c0392b; padding: 1rem 1.5rem;
    border-radius: 8px; margin-top: 1rem;
  }
  .note-ling {
    background: #fff8e1; border-left: 4px solid #f39c12;
    padding: 0.8rem 1rem; margin-top: 1.5rem;
    font-size: 0.85rem; color: #7d5a00; border-radius: 6px;
  }
  #loading {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; color: #999;
  }
  .spinner {
    width: 40px; height: 40px; border: 4px solid var(--gris-clair);
    border-top-color: var(--bleu); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    body { flex-direction: column; }
    #sidebar {
      width: 100%; min-width: 100%; height: 45vh;
      border-right: none; border-bottom: 1px solid var(--gris-clair);
    }
    #contenu-principal { height: 55vh; padding: 1rem; }
    .carte-verbe h1 { font-size: 1.3rem; }
    .onglet { font-size: 0.8rem; padding: 0.4rem 0.8rem; }
    .tableau-conj th, .tableau-conj td {
      padding: 0.5rem 0.6rem; font-size: 0.85rem;
    }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sidebar-header">
    <h2>📚 Verbes Tachelhit</h2>
    <p>Base de données de conjugaison amazighe</p>
  </div>
  <div class="search-box">
    <input type="text" id="recherche"
      placeholder="Rechercher (français, latin ou tifinagh)..."
      autocomplete="off" spellcheck="false">
  </div>
  <div id="verbe-liste"></div>
  <div class="compteur" id="compteur">Chargement...</div>
</aside>

<main id="contenu-principal">
  <div id="loading">
    <div class="spinner"></div>
    <p>Chargement de la base de données...</p>
  </div>
  <div id="zone-resultat" style="display:none;"></div>
</main>

<script>
/* =====================================================================
   CONFIGURATION
   ===================================================================== */
const FICHIER_DATASET = "amazigh-conjugation-dataset-v1.0.json";

/* =====================================================================
   ÉTAT GLOBAL
   ===================================================================== */
let TOUS_LES_VERBES = [];
let VERBES_FILTRES = [];
let VERBE_ACTIF = null;
let THEME_ACTIF = "ao";

/* =====================================================================
   THÈMES VERBAUX
   ===================================================================== */
const THEMES = {
  "ao":    { label: "Aoriste",             abbr: "ao"    },
  "acc":   { label: "Accompli",            abbr: "acc"   },
  "accn":  { label: "Accompli négatif",    abbr: "accn"  },
  "inacc": { label: "Inaccompli",          abbr: "inacc" },
  "imp":   { label: "Impératif",           abbr: "imp"   },
  "impi":  { label: "Impératif intensif",  abbr: "impi"  }
};

/* =====================================================================
   LES 10 PERSONNES GRAMMATICALES
   ===================================================================== */
const PERSONNES = {
  "s1":  { label: "1ʳᵉ pers. sing.",      cle: "s1", genre: null },
  "s2m": { label: "2ᵉ pers. sing. (m)",   cle: "s2", genre: "m" },
  "s2f": { label: "2ᵉ pers. sing. (f)",   cle: "s2", genre: "f" },
  "s3m": { label: "3ᵉ pers. sing. (m)",   cle: "s3", genre: "m" },
  "s3f": { label: "3ᵉ pers. sing. (f)",   cle: "s3", genre: "f" },
  "p1":  { label: "1ʳᵉ pers. plur.",      cle: "p1", genre: null },
  "p2m": { label: "2ᵉ pers. plur. (m)",   cle: "p2", genre: "m" },
  "p2f": { label: "2ᵉ pers. plur. (f)",   cle: "p2", genre: "f" },
  "p3m": { label: "3ᵉ pers. plur. (m)",   cle: "p3", genre: "m" },
  "p3f": { label: "3ᵉ pers. plur. (f)",   cle: "p3", genre: "f" }
};

/* =====================================================================
   TABLE DE CORRESPONDANCE TIFINAGH → LATIN
   ===================================================================== */
const TIFINAGH_VERS_LATIN = {
  'ⴰ': 'a',  'ⴱ': 'b',  'ⴳ': 'ɡ',  'ⴷ': 'd',  'ⴻ': 'e',  'ⴼ': 'f',
  'ⴽ': 'k',  'ⵀ': 'h',  'ⵃ': 'ḥ',  'ⵄ': 'ɛ',  'ⵅ': 'x',  'ⵇ': 'q',
  'ⵉ': 'i',  'ⵊ': 'j',  'ⵍ': 'l',  'ⵎ': 'm',  'ⵏ': 'n',  'ⵓ': 'u',
  'ⵔ': 'r',  'ⵕ': 'ṛ',  'ⵖ': 'ɣ',  'ⵙ': 's',  'ⵚ': 'ṣ',  'ⵛ': 'c',
  'ⵜ': 't',  'ⵟ': 'ṭ',  'ⵡ': 'w',  'ⵢ': 'y',  'ⵣ': 'z',  'ⵥ': 'ẓ',
  'ⵯ': 'ʷ',  'ⵞ': 'č',  'ⴹ': 'ḍ',  'ⵠ': 'v',  'ⵒ': 'p'
};

function translitterer(texteTifinagh) {
  if (!texteTifinagh) return "";
  return texteTifinagh
    .split('')
    .map(car => TIFINAGH_VERS_LATIN[car] || car)
    .join('');
}

/* =====================================================================
   EXTRACTION DE LA TRADUCTION FRANÇAISE
   ---------------------------------------------------------------------
   Le dataset contient un champ "fr" structuré ainsi :
   "fr": { "fr1": "être loin, éloigné", "fr2": "...", ... }
   On joint toutes les sous-clés disponibles.
   ===================================================================== */
function getTraductionFR(verbe) {
  if (!verbe || !verbe.fr) return "";
  if (typeof verbe.fr === "string") return verbe.fr;
  // Cas d'un objet { fr1, fr2, ... }
  const valeurs = Object.values(verbe.fr).filter(v => typeof v === "string");
  return valeurs.join(" ; ");
}

/* =====================================================================
   EXTRACTION DE LA TRADUCTION ARABE (bonus)
   ===================================================================== */
function getTraductionAR(verbe) {
  if (!verbe || !verbe.ar) return "";
  if (typeof verbe.ar === "string") return verbe.ar;
  const valeurs = Object.values(verbe.ar).filter(v => typeof v === "string");
  return valeurs.join(" ; ");
}

/* =====================================================================
   CHARGEMENT DU DATASET
   ===================================================================== */
async function chargerDataset() {
  try {
    const reponse = await fetch(FICHIER_DATASET);
    if (!reponse.ok) throw new Error(`HTTP ${reponse.status}`);
    const data = await reponse.json();

    if (Array.isArray(data)) {
      TOUS_LES_VERBES = data;
    } else if (typeof data === "object") {
      TOUS_LES_VERBES = Object.values(data);
    } else {
      throw new Error("Format de données non reconnu.");
    }

    TOUS_LES_VERBES = TOUS_LES_VERBES.filter(
      v => v && (v.lemma || v.racine || v.verb)
    );

    VERBES_FILTRES = [...TOUS_LES_VERBES];
    afficherListeIndex();
    mettreAJourCompteur();
    document.getElementById("loading").style.display = "none";
    document.getElementById("zone-resultat").style.display = "block";
    afficherAccueil();
  } catch (err) {
    document.getElementById("loading").innerHTML = `
      <div class="message-erreur" style="max-width:500px;">
        <strong>❌ Impossible de charger la base de données.</strong><br>
        Vérifiez que le fichier <code>${FICHIER_DATASET}</code> est bien
        placé dans le même dossier que ce fichier HTML.<br>
        <small>Erreur : ${err.message}</small>
      </div>`;
  }
}

/* =====================================================================
   INDEX — AFFICHAGE AVEC TRADUCTION FRANÇAISE
   ===================================================================== */
function afficherListeIndex() {
  const conteneur = document.getElementById("verbe-liste");
  const fragment = document.createDocumentFragment();

  VERBES_FILTRES.slice(0, 500).forEach((verbe, index) => {
    const div = document.createElement("div");
    div.className = "verbe-item";
    if (VERBE_ACTIF && VERBE_ACTIF.lemma === verbe.lemma) {
      div.classList.add("active");
    }
    div.dataset.index = index;

    const tifinagh = verbe.lemma || "";
    const latin = translitterer(tifinagh);
    const fr = getTraductionFR(verbe);

    div.innerHTML = `
      <span class="ligne-fr">${fr || "—"}</span>
      <span class="ligne-latin">${latin}</span>
      <span class="ligne-tifinagh">${tifinagh}</span>
    `;

    div.addEventListener("click", () => selectionnerVerbe(verbe));
    fragment.appendChild(div);
  });

  conteneur.innerHTML = "";
  conteneur.appendChild(fragment);

  if (VERBES_FILTRES.length > 500) {
    const info = document.createElement("div");
    info.className = "compteur";
    info.textContent = `… et ${VERBES_FILTRES.length - 500} autres. Affinez la recherche.`;
    conteneur.appendChild(info);
  }
}

function mettreAJourCompteur() {
  document.getElementById("compteur").textContent =
    `${TOUS_LES_VERBES.length} verbes disponibles`;
}

/* =====================================================================
   FILTRAGE — INCLUT LA RECHERCHE PAR TRADUCTION FRANÇAISE
   ===================================================================== */
function filtrerVerbes() {
  const requete = document.getElementById("recherche").value
    .trim().toLowerCase();

  if (!requete) {
    VERBES_FILTRES = [...TOUS_LES_VERBES];
  } else {
    VERBES_FILTRES = TOUS_LES_VERBES.filter(v => {
      const tifinagh = (v.lemma || "").toLowerCase();
      const latin = translitterer(v.lemma || "").toLowerCase();
      const fr = getTraductionFR(v).toLowerCase();
      return tifinagh.includes(requete) || latin.includes(requete)
          || fr.includes(requete);
    });
  }
  afficherListeIndex();
}

/* =====================================================================
   SÉLECTION D'UN VERBE
   ===================================================================== */
function selectionnerVerbe(verbe) {
  VERBE_ACTIF = verbe;
  THEME_ACTIF = "ao";
  document.querySelectorAll(".verbe-item").forEach(el => el.classList.remove("active"));
  afficherConjugaison(verbe);
  document.getElementById("contenu-principal").scrollTop = 0;
}

/* =====================================================================
   AFFICHAGE DE LA CONJUGAISON — AVEC TRADUCTION
   ===================================================================== */
function afficherConjugaison(verbe) {
  const zone = document.getElementById("zone-resultat");

  const tifinagh = verbe.lemma || "";
  const latin = translitterer(tifinagh);
  const fr = getTraductionFR(verbe);
  const ar = getTraductionAR(verbe);
  const groupe = verbe.ConjugationForm || "";

  let ongletsHTML = "";
  for (const [cle, theme] of Object.entries(THEMES)) {
    if (verbe[cle]) {
      const actif = cle === THEME_ACTIF ? "active" : "";
      ongletsHTML += `
        <button class="onglet ${actif}" data-theme="${cle}">
          ${theme.label}
          <span class="abbr">${theme.abbr}</span>
        </button>`;
    }
  }

  const tableauHTML = construireTableau(verbe, THEME_ACTIF);

  zone.innerHTML = `
    <div class="carte-verbe">
      <h1>
        ${fr || "—"}
        <span class="tifinagh-titre">${tifinagh}</span>
        <span class="latin-titre">${latin}</span>
        ${groupe ? `<span class="badge-groupe">${groupe}</span>` : ""}
      </h1>

      <div class="traductions-info">
        <div class="bloc"><strong>🇫🇷 Français :</strong> ${fr || "—"}</div>
        ${ar ? `<div class="bloc" dir="rtl"><strong>🇲🇦 Arabe :</strong> ${ar}</div>` : ""}
      </div>

      <div class="onglets">${ongletsHTML}</div>
      <div id="zone-tableau">${tableauHTML}</div>
      <div class="note-ling">
        ⚠️ <strong>Note :</strong> Cette base de données est issue du
        <em>Manuel de conjugaison amazighe</em> (IRCAM, 2012) et du
        conjugueur <em>Amsfti</em>. Les variantes régionales peuvent exister.
        Consultez l'IRCAM pour un usage académique.
      </div>
    </div>`;

  zone.querySelectorAll(".onglet").forEach(btn => {
    btn.addEventListener("click", () => {
      THEME_ACTIF = btn.dataset.theme;
      zone.querySelectorAll(".onglet").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("zone-tableau").innerHTML =
        construireTableau(verbe, THEME_ACTIF);
    });
  });
}

/* =====================================================================
   CONSTRUCTION DU TABLEAU
   ===================================================================== */
function construireTableau(verbe, theme) {
  const data = verbe[theme];
  if (!data) {
    return `<div class="message-erreur">
      Aucune donnée pour le thème « ${THEMES[theme]?.label || theme} ».
    </div>`;
  }

  let lignes = "";

  for (const [cle, info] of Object.entries(PERSONNES)) {
    const entree = data[info.cle];
    if (!entree) continue;

    let formeTifinagh = "";

    if (typeof entree === "object" && entree !== null) {
      if (info.genre) {
        formeTifinagh = entree[info.genre] || "";
      } else {
        formeTifinagh = entree.m || entree.f || "";
      }
    } else if (typeof entree === "string") {
      formeTifinagh = entree;
    }

    if (!formeTifinagh) continue;

    const formeLatine = translitterer(formeTifinagh);

    lignes += `
      <tr>
        <td class="personne">${info.label}</td>
        <td class="forme-latin">${formeLatine}</td>
        <td class="forme-tifinagh">${formeTifinagh}</td>
      </tr>`;
  }

  if (!lignes) {
    return `<div class="message-erreur">
      Aucune forme disponible pour ce thème.
    </div>`;
  }

  return `
    <table class="tableau-conj">
      <thead>
        <tr>
          <th>Personne</th>
          <th>Translittération latine</th>
          <th>Tifinagh</th>
        </tr>
      </thead>
      <tbody>${lignes}</tbody>
    </table>`;
}

/* =====================================================================
   ACCUEIL
   ===================================================================== */
function afficherAccueil() {
  document.getElementById("zone-resultat").innerHTML = `
    <div class="accueil">
      <div class="icone">📖</div>
      <h2>Sélectionnez un verbe dans l'index</h2>
      <p>
        Utilisez la barre de recherche à gauche pour filtrer les verbes
        par traduction française, translittération latine ou Tifinagh,
        puis cliquez sur un verbe pour afficher sa conjugaison complète.
      </p>
    </div>`;
}

/* =====================================================================
   ÉCOUTEURS
   ===================================================================== */
document.addEventListener("DOMContentLoaded", () => {
  chargerDataset();
  const input = document.getElementById("recherche");
  let timeout;
  input.addEventListener("input", () => {
    clearTimeout(timeout);
    timeout = setTimeout(filtrerVerbes, 150);
  });
});
</script>
</body>
</html>
