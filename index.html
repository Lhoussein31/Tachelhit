<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2c5f8d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Conjugaison Tachelhit — Base de données exhaustive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bleu: #2c5f8d; --bleu-fonce: #1a3a56; --ocre: #c8862c;
    --gris: #333; --gris-clair: #e8e8e8; --gris-fonce: #555;
    --tifinagh-font: 'Noto Sans Tifinagh', 'Segoe UI', sans-serif;
    --header-h: 60px;
  }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f0f2f5; color: var(--gris); line-height: 1.6;
    display: flex; overflow: hidden;
    height: 100vh; height: 100dvh;
  }

  /* ===== SIDEBAR (desktop) ===== */
  #sidebar {
    width: 380px; min-width: 380px; background: white;
    border-right: 1px solid var(--gris-clair);
    display: flex; flex-direction: column; height: 100%;
    box-shadow: 2px 0 8px rgba(0,0,0,0.05); z-index: 30;
  }
  .sidebar-header { padding: 1.2rem; background: var(--bleu); color: white; }
  .sidebar-header h2 { font-size: 1.1rem; margin-bottom: 0.2rem; }
  .sidebar-header p { font-size: 0.8rem; opacity: 0.85; }
  .search-box {
    padding: 0.8rem 1rem; border-bottom: 1px solid var(--gris-clair);
    background: #fafafa;
  }
  .search-box input {
    width: 100%; padding: 0.7rem 0.9rem; font-size: 1rem;
    border: 2px solid var(--gris-clair); border-radius: 8px;
    transition: border-color 0.2s;
    /* Empêche le zoom auto sur iOS (taille >= 16px) */
    font-size: 16px;
  }
  .search-box input:focus { outline: none; border-color: var(--bleu); }
  #verbe-liste { flex: 1; overflow-y: auto; padding: 0.5rem 0; -webkit-overflow-scrolling: touch; }
  #verbe-liste::-webkit-scrollbar { width: 6px; }
  #verbe-liste::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  .verbe-item {
    padding: 0.7rem 1.2rem; cursor: pointer;
    border-bottom: 1px solid #f5f5f5; transition: background 0.15s;
    display: flex; flex-direction: column; gap: 0.15rem;
    min-height: 60px;
  }
  .verbe-item:hover { background: #f0f6ff; }
  .verbe-item:active { background: #d9e8fa; }
  .verbe-item.active {
    background: #e3f0ff; border-left: 4px solid var(--bleu); font-weight: 600;
  }
  .verbe-item .ligne-fr {
    font-size: 0.95rem; color: var(--bleu-fonce); font-weight: 600;
  }
  .verbe-item .ligne-latin { font-size: 0.85rem; color: var(--gris-fonce); }
  .verbe-item .ligne-tifinagh {
    font-family: var(--tifinagh-font); font-size: 0.9rem; color: var(--ocre);
  }
  .compteur {
    padding: 0.8rem 1.2rem; font-size: 0.8rem; color: #888;
    text-align: center; border-top: 1px solid var(--gris-clair); background: #fafafa;
  }

  /* ===== ZONE PRINCIPALE ===== */
  #contenu-principal {
    flex: 1; overflow-y: auto; padding: 2rem; height: 100%;
    -webkit-overflow-scrolling: touch;
  }
  .accueil {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; text-align: center; color: #999;
    padding: 2rem 1rem;
  }
  .accueil .icone { font-size: 4rem; margin-bottom: 1rem; }
  .accueil h2 { font-size: 1.4rem; color: var(--bleu-fonce); margin-bottom: 0.5rem; }
  .accueil p { max-width: 400px; }

  .carte-verbe { max-width: 1000px; margin: 0 auto; animation: apparition 0.25s ease; }
  @keyframes apparition {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .carte-verbe h1 {
    font-size: 1.8rem; color: var(--bleu-fonce); margin-bottom: 0.3rem;
    display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
  }
  .carte-verbe h1 .tifinagh-titre {
    font-family: var(--tifinagh-font); color: var(--ocre); font-size: 1.4rem;
  }
  .carte-verbe h1 .latin-titre {
    font-size: 1.1rem; color: var(--gris-fonce); font-weight: 400;
    font-style: italic;
  }
  .badge-groupe {
    background: var(--bleu); color: white; font-size: 0.75rem;
    padding: 0.2rem 0.8rem; border-radius: 20px; font-weight: normal;
  }
  .traductions-info {
    display: flex; flex-wrap: wrap; gap: 1rem;
    margin-bottom: 1.5rem; font-size: 0.9rem; color: var(--gris-fonce);
  }
  .traductions-info .bloc {
    background: #f9f6f0; padding: 0.4rem 0.8rem; border-radius: 6px;
    border-left: 3px solid var(--ocre);
  }
  .traductions-info .bloc strong { color: var(--bleu-fonce); }

  .onglets {
    display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem;
    border-bottom: 2px solid var(--gris-clair); padding-bottom: 0.5rem;
  }
  .onglet {
    padding: 0.5rem 1.2rem; border: none; background: transparent;
    cursor: pointer; font-size: 0.9rem; font-weight: 500;
    color: var(--gris-fonce); border-radius: 8px 8px 0 0;
    transition: all 0.2s;
    min-height: 44px;
  }
  .onglet:hover { background: #f0f6ff; color: var(--bleu); }
  .onglet:active { transform: scale(0.97); }
  .onglet.active { background: var(--bleu); color: white; }
  .onglet .abbr { font-size: 0.7rem; opacity: 0.7; display: block; }

  .tableau-conj {
    width: 100%; border-collapse: collapse; background: white;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 2rem;
    display: block;
  }
  .tableau-conj thead { display: none; } /* masqué par défaut, activé desktop */
  .tableau-conj tbody { display: block; width: 100%; }

  /* ===== MOBILE ===== */
  @media (max-width: 900px) {
    body {
      flex-direction: column;
    }

    /* Barre supérieure fixe avec bouton menu */
    .mobile-topbar {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: var(--bleu);
      color: white;
      padding: 0.7rem 1rem;
      padding-top: calc(0.7rem + env(safe-area-inset-top));
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .mobile-topbar h1 {
      font-size: 1rem;
      font-weight: 600;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-menu {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      width: 42px; height: 42px;
      border-radius: 10px;
      font-size: 1.4rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .btn-menu:active { background: rgba(255,255,255,0.3); }

    /* Sidebar en overlay */
    #sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 88%;
      max-width: 400px;
      min-width: 0;
      height: 100%;
      transform: translateX(-105%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      box-shadow: 4px 0 20px rgba(0,0,0,0.2);
      border-right: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #sidebar.ouvert { transform: translateX(0); }

    /* Voile sombre */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 90;
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }
    #overlay.visible { opacity: 1; pointer-events: auto; }

    /* Zone principale */
    #contenu-principal {
      padding: 1rem;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
      flex: 1;
      width: 100%;
    }

    /* Carte verbe */
    .carte-verbe h1 {
      font-size: 1.25rem;
      gap: 0.5rem;
      flex-direction: column;
      align-items: flex-start;
    }
    .carte-verbe h1 .tifinagh-titre {
      font-size: 1.15rem;
    }
    .carte-verbe h1 .latin-titre {
      font-size: 1rem;
    }
    .badge-groupe { font-size: 0.7rem; padding: 0.15rem 0.6rem; }

    .traductions-info {
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.85rem;
    }
    .traductions-info .bloc { width: 100%; }

    /* Onglets : scroll horizontal */
    .onglets {
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
      /* Compense le padding de la carte pour permettre un scroll bord-à-bord */
      margin-left: -1rem;
      margin-right: -1rem;
      padding-left: 1rem;
      padding-right: 1rem;
    }
    .onglets::-webkit-scrollbar { display: none; }
    .onglet {
      flex-shrink: 0;
      font-size: 0.82rem;
      padding: 0.55rem 0.9rem;
      scroll-snap-align: start;
      white-space: nowrap;
    }

    /* Tableau transformé en cartes empilées */
    .tableau-conj {
      display: block;
      box-shadow: none;
      background: transparent;
      border-radius: 0;
      margin-bottom: 1rem;
    }
    .tableau-conj thead { display: none; }
    .tableau-conj tbody { display: block; }

    .tableau-conj tr {
      display: block;
      background: white;
      border-radius: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      margin-bottom: 0.6rem;
      padding: 0.7rem 0.9rem;
      border-left: 4px solid var(--bleu);
    }
    .tableau-conj td {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.8rem;
      padding: 0.25rem 0;
      border-bottom: none;
      font-size: 0.95rem;
      text-align: right;
    }
    .tableau-conj td::before {
      content: attr(data-label);
      font-weight: 600;
      color: var(--gris-fonce);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      text-align: left;
    }
    .tableau-conj td.personne {
      font-size: 0.95rem;
      color: var(--bleu-fonce);
      border-bottom: 1px solid var(--gris-clair);
      padding-bottom: 0.5rem;
      margin-bottom: 0.3rem;
      justify-content: flex-start;
    }
    .tableau-conj td.personne::before { display: none; }
    .tableau-conj td.forme-latin { font-size: 1rem; font-weight: 500; }
    .tableau-conj td.forme-tifinagh {
      font-size: 1.15rem;
      color: var(--ocre);
    }

    .message-erreur { padding: 0.9rem 1.1rem; font-size: 0.9rem; }
    .note-ling { font-size: 0.8rem; padding: 0.7rem 0.9rem; }
    .accueil .icone { font-size: 3rem; }
    .accueil h2 { font-size: 1.15rem; }
    .accueil p { font-size: 0.9rem; }
  }

  /* Barre mobile masquée sur desktop */
  @media (min-width: 901px) {
    .mobile-topbar { display: none; }
    #overlay { display: none; }
    .tableau-conj { display: table; }
    .tableau-conj thead { display: table-header-group; }
    .tableau-conj tbody { display: table-row-group; }
    .tableau-conj tr { display: table-row; }
    .tableau-conj td {
      display: table-cell;
      text-align: left;
      border-bottom: 1px solid var(--gris-clair);
      padding: 0.65rem 1rem;
    }
    .tableau-conj td::before { display: none; }
    .tableau-conj td.personne { border-bottom: 1px solid var(--gris-clair); padding-bottom: 0.65rem; margin: 0; }
    .tableau-conj th {
      padding: 0.7rem 1rem; text-align: left;
      font-size: 0.85rem; font-weight: 600; letter-spacing: 0.5px;
    }
    .tableau-conj th:first-child { width: 32%; }
    .tableau-conj tbody tr:last-child td { border-bottom: none; }
    .tableau-conj tbody tr:hover { background: #f9f6f0; }
  }
</style>
</head>
<body>

<!-- Overlay pour fermer la sidebar sur mobile -->
<div id="overlay"></div>

<aside id="sidebar">
  <div class="sidebar-header">
    <h2>📚 Verbes Tachelhit</h2>
    <p>Base de données de conjugaison amazighe</p>
  </div>
  <div class="search-box">
    <input type="text" id="recherche"
      placeholder="Rechercher (fr, latin ou tifinagh — sans emphase OK)..."
      autocomplete="off" spellcheck="false"
      inputmode="search" enterkeyhint="search">
  </div>
  <div id="verbe-liste"></div>
  <div class="compteur" id="compteur">Chargement...</div>
</aside>

<main id="contenu-principal">
  <!-- Barre mobile sticky -->
  <div class="mobile-topbar">
    <button class="btn-menu" id="btn-menu" aria-label="Ouvrir le menu">☰</button>
    <h1>Conjugaison Tachelhit</h1>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p>Chargement de la base de données...</p>
  </div>
  <div id="zone-resultat" style="display:none;"></div>
</main>

<script>
/* =====================================================================
   CONFIGURATION
   ===================================================================== */
const FICHIER_DATASET = "amazigh-conjugation-dataset-v1.0.json";

/* =====================================================================
   ÉTAT GLOBAL
   ===================================================================== */
let TOUS_LES_VERBES = [];
let VERBES_FILTRES = [];
let VERBE_ACTIF = null;
let THEME_ACTIF = "ao";

/* =====================================================================
   THÈMES VERBAUX
   ===================================================================== */
const THEMES = {
  "ao":    { label: "Aoriste",             abbr: "ao"    },
  "acc":   { label: "Accompli",            abbr: "acc"   },
  "accn":  { label: "Accompli négatif",    abbr: "accn"  },
  "inacc": { label: "Inaccompli",          abbr: "inacc" },
  "imp":   { label: "Impératif",           abbr: "imp"   },
  "impi":  { label: "Impératif intensif",  abbr: "impi"  }
};

/* =====================================================================
   PERSONNES POUR LES THÈMES STANDARD
   ===================================================================== */
const PERSONNES = {
  "s1":  { label: "1ʳᵉ pers. sing.",      cle: "s1", genre: null },
  "s2m": { label: "2ᵉ pers. sing. (m)",   cle: "s2", genre: "m" },
  "s2f": { label: "2ᵉ pers. sing. (f)",   cle: "s2", genre: "f" },
  "s3m": { label: "3ᵉ pers. sing. (m)",   cle: "s3", genre: "m" },
  "s3f": { label: "3ᵉ pers. sing. (f)",   cle: "s3", genre: "f" },
  "p1":  { label: "1ʳᵉ pers. plur.",      cle: "p1", genre: null },
  "p2m": { label: "2ᵉ pers. plur. (m)",   cle: "p2", genre: "m" },
  "p2f": { label: "2ᵉ pers. plur. (f)",   cle: "p2", genre: "f" },
  "p3m": { label: "3ᵉ pers. plur. (m)",   cle: "p3", genre: "m" },
  "p3f": { label: "3ᵉ pers. plur. (f)",   cle: "p3", genre: "f" }
};

/* =====================================================================
   PERSONNES POUR L'IMPÉRATIF
   ===================================================================== */
const PERSONNES_IMPERATIF = {
  "s.m":  { label: "2ᵉ pers. sing. (m)",                cle: "s", genre: "m"  },
  "s.f":  { label: "2ᵉ pers. sing. (f)",                cle: "s", genre: "f"  },
  "p.m1": { label: "2ᵉ pers. plur. (m) — forme 1",      cle: "p", genre: "m1" },
  "p.m2": { label: "2ᵉ pers. plur. (m) — forme 2",      cle: "p", genre: "m2" },
  "p.f":  { label: "2ᵉ pers. plur. (f)",                cle: "p", genre: "f"  }
};

/* =====================================================================
   TABLE DE CORRESPONDANCE TIFINAGH → LATIN
   ===================================================================== */
const TIFINAGH_VERS_LATIN = {
  'ⴰ': 'a',  'ⴱ': 'b',  'ⴳ': 'ɡ',  'ⴷ': 'd',  'ⴻ': 'e',  'ⴼ': 'f',
  'ⴽ': 'k',  'ⵀ': 'h',  'ⵃ': 'ḥ',  'ⵄ': 'ɛ',  'ⵅ': 'x',  'ⵇ': 'q',
  'ⵉ': 'i',  'ⵊ': 'j',  'ⵍ': 'l',  'ⵎ': 'm',  'ⵏ': 'n',  'ⵓ': 'u',
  'ⵔ': 'r',  'ⵕ': 'ṛ',  'ⵖ': 'ɣ',  'ⵙ': 's',  'ⵚ': 'ṣ',  'ⵛ': 'c',
  'ⵜ': 't',  'ⵟ': 'ṭ',  'ⵡ': 'w',  'ⵢ': 'y',  'ⵣ': 'z',  'ⵥ': 'ẓ',
  'ⵯ': 'ʷ',  'ⵞ': 'č',  'ⴹ': 'ḍ',  'ⵠ': 'v',  'ⵒ': 'p'
};

function translitterer(texteTifinagh) {
  if (!texteTifinagh) return "";
  return texteTifinagh
    .split('')
    .map(car => TIFINAGH_VERS_LATIN[car] || car)
    .join('');
}

/* =====================================================================
   NORMALISATION POUR LA RECHERCHE
   ===================================================================== */
const CARACTERES_SPECIAUX = {
  'ɛ': 'e', 'ɣ': 'g', 'ḥ': 'h', 'ṛ': 'r', 'ṣ': 's',
  'ṭ': 't', 'ẓ': 'z', 'ḍ': 'd', 'č': 'c', 'ʷ': 'w',
  'ⵯ': 'w', 'ɡ': 'g'
};

function normaliser(texte) {
  if (!texte) return "";
  return texte
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .split('')
    .map(c => CARACTERES_SPECIAUX[c] || c)
    .join('');
}

/* =====================================================================
   EXTRACTION RÉCURSIVE DES TEXTES
   ===================================================================== */
function extraireTextes(obj) {
  if (typeof obj === "string") return [obj];
  if (Array.isArray(obj)) return obj.flatMap(item => extraireTextes(item));
  if (typeof obj === "object" && obj !== null) {
    return Object.values(obj).flatMap(val => extraireTextes(val));
  }
  return [];
}

function getTraductionFR(verbe) {
  if (!verbe || !verbe.fr) return "";
  const valeurs = extraireTextes(verbe.fr);
  return valeurs.filter(v => v.trim() !== "").join(" ; ");
}

function getTraductionAR(verbe) {
  if (!verbe || !verbe.ar) return "";
  const valeurs = extraireTextes(verbe.ar);
  return valeurs.filter(v => v.trim() !== "").join(" ; ");
}

/* =====================================================================
   CHARGEMENT DU DATASET
   ===================================================================== */
async function chargerDataset() {
  try {
    const reponse = await fetch(FICHIER_DATASET);
    if (!reponse.ok) throw new Error(`HTTP ${reponse.status}`);
    const data = await reponse.json();

    if (Array.isArray(data)) {
      TOUS_LES_VERBES = data;
    } else if (typeof data === "object") {
      TOUS_LES_VERBES = Object.values(data);
    } else {
      throw new Error("Format de données non reconnu.");
    }

    TOUS_LES_VERBES = TOUS_LES_VERBES.filter(
      v => v && (v.lemma || v.racine || v.verb)
    );

    TOUS_LES_VERBES = TOUS_LES_VERBES.map(v => {
      if (v.lemma) v.lemma = v.lemma.replace(/^[°\u0000-\u001F\u007F]+/, "").trim();
      return v;
    });

    VERBES_FILTRES = [...TOUS_LES_VERBES];
    afficherListeIndex();
    mettreAJourCompteur();
    document.getElementById("loading").style.display = "none";
    document.getElementById("zone-resultat").style.display = "block";
    afficherAccueil();
  } catch (err) {
    document.getElementById("loading").innerHTML = `
      <div class="message-erreur" style="max-width:500px;">
        <strong>❌ Impossible de charger la base de données.</strong><br>
        Vérifiez que le fichier <code>${FICHIER_DATASET}</code> est bien
        placé dans le même dossier que ce fichier HTML.<br>
        <small>Erreur : ${err.message}</small>
      </div>`;
  }
}

/* =====================================================================
   INDEX — AFFICHAGE
   ===================================================================== */
function afficherListeIndex() {
  const conteneur = document.getElementById("verbe-liste");
  const fragment = document.createDocumentFragment();

  VERBES_FILTRES.slice(0, 500).forEach((verbe, index) => {
    const div = document.createElement("div");
    div.className = "verbe-item";
    if (VERBE_ACTIF && VERBE_ACTIF.lemma === verbe.lemma) {
      div.classList.add("active");
    }
    div.dataset.index = index;

    const tifinagh = verbe.lemma || "";
    const latin = translitterer(tifinagh);
    const fr = getTraductionFR(verbe);

    div.innerHTML = `
      <span class="ligne-fr">${fr || "—"}</span>
      <span class="ligne-latin">${latin}</span>
      <span class="ligne-tifinagh">${tifinagh}</span>
    `;

    div.addEventListener("click", () => selectionnerVerbe(verbe));
    fragment.appendChild(div);
  });

  conteneur.innerHTML = "";
  conteneur.appendChild(fragment);

  if (VERBES_FILTRES.length > 500) {
    const info = document.createElement("div");
    info.className = "compteur";
    info.textContent = `… et ${VERBES_FILTRES.length - 500} autres. Affinez la recherche.`;
    conteneur.appendChild(info);
  }
}

function mettreAJourCompteur() {
  document.getElementById("compteur").textContent =
    `${TOUS_LES_VERBES.length} verbes disponibles`;
}

function mettreAJourCompteurRecherche() {
  const compteur = document.getElementById("compteur");
  if (VERBES_FILTRES.length === TOUS_LES_VERBES.length) {
    compteur.textContent = `${TOUS_LES_VERBES.length} verbes disponibles`;
  } else {
    compteur.textContent =
      `${VERBES_FILTRES.length} / ${TOUS_LES_VERBES.length} verbes trouvés`;
  }
}

/* =====================================================================
   FILTRAGE
   ===================================================================== */
function filtrerVerbes() {
  const requeteBrute = document.getElementById("recherche").value.trim();
  const requete = normaliser(requeteBrute);

  if (!requete) {
    VERBES_FILTRES = [...TOUS_LES_VERBES];
  } else {
    VERBES_FILTRES = TOUS_LES_VERBES.filter(v => {
      const tifinagh = normaliser(v.lemma || "");
      const latin    = normaliser(translitterer(v.lemma || ""));
      const fr       = normaliser(getTraductionFR(v));
      const ar       = normaliser(getTraductionAR(v));
      return tifinagh.includes(requete)
          || latin.includes(requete)
          || fr.includes(requete)
          || ar.includes(requete);
    });
  }
  afficherListeIndex();
  mettreAJourCompteurRecherche();
}

/* =====================================================================
   SÉLECTION D'UN VERBE
   ===================================================================== */
function selectionnerVerbe(verbe) {
  VERBE_ACTIF = verbe;
  THEME_ACTIF = "ao";
  document.querySelectorAll(".verbe-item").forEach(el => el.classList.remove("active"));
  afficherConjugaison(verbe);
  document.getElementById("contenu-principal").scrollTop = 0;

  // Fermer la sidebar sur mobile après sélection
  if (window.matchMedia("(max-width: 900px)").matches) {
    fermerSidebar();
    // Retirer le focus du champ de recherche pour cacher le clavier
    document.getElementById("recherche").blur();
  }
}

/* =====================================================================
   AFFICHAGE DE LA CONJUGAISON
   ===================================================================== */
function afficherConjugaison(verbe) {
  const zone = document.getElementById("zone-resultat");

  const tifinagh = verbe.lemma || "";
  const latin = translitterer(tifinagh);
  const fr = getTraductionFR(verbe);
  const ar = getTraductionAR(verbe);
  const groupe = verbe.ConjugationForm || "";

  let ongletsHTML = "";
  for (const [cle, theme] of Object.entries(THEMES)) {
    if (verbe[cle]) {
      const actif = cle === THEME_ACTIF ? "active" : "";
      ongletsHTML += `
        <button class="onglet ${actif}" data-theme="${cle}">
          ${theme.label}
          <span class="abbr">${theme.abbr}</span>
        </button>`;
    }
  }

  const tableauHTML = construireTableau(verbe, THEME_ACTIF);

  zone.innerHTML = `
    <div class="carte-verbe">
      <h1>
        ${fr || "—"}
        <span class="tifinagh-titre">${tifinagh}</span>
        <span class="latin-titre">${latin}</span>
        ${groupe ? `<span class="badge-groupe">${groupe}</span>` : ""}
      </h1>

      <div class="traductions-info">
        <div class="bloc"><strong>🇫🇷 Français :</strong> ${fr || "—"}</div>
        ${ar ? `<div class="bloc" dir="rtl"><strong>🇲🇦 Arabe :</strong> ${ar}</div>` : ""}
      </div>

      <div class="onglets">${ongletsHTML}</div>
      <div id="zone-tableau">${tableauHTML}</div>
      <div class="note-ling">
        ⚠️ <strong>Note :</strong> Cette base de données est issue du
        <em>Manuel de conjugaison amazighe</em> (IRCAM, 2012) et du
        conjugueur <em>Amsfti</em>. Les variantes régionales peuvent exister.
        Consultez l'IRCAM pour un usage académique.
      </div>
    </div>`;

  zone.querySelectorAll(".onglet").forEach(btn => {
    btn.addEventListener("click", () => {
      THEME_ACTIF = btn.dataset.theme;
      zone.querySelectorAll(".onglet").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("zone-tableau").innerHTML =
        construireTableau(verbe, THEME_ACTIF);
      // Recentrer l'onglet actif dans la vue (mobile)
      btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    });
  });
}

/* =====================================================================
   CONSTRUCTION DU TABLEAU
   ---------------------------------------------------------------------
   Les cellules reçoivent un attribut data-label utilisé sur mobile
   pour afficher un libellé devant chaque valeur (via CSS ::before).
   ===================================================================== */
function construireTableau(verbe, theme) {
  const data = verbe[theme];
  if (!data) {
    return `<div class="message-erreur">
      Aucune donnée pour le thème « ${THEMES[theme]?.label || theme} ».
    </div>`;
  }

  const estImperatif = (theme === "imp" || theme === "impi");
  let lignes = "";

  if (estImperatif) {
    for (const info of Object.values(PERSONNES_IMPERATIF)) {
      const entree = data[info.cle];
      if (!entree || typeof entree !== "object") continue;

      const formeTifinagh = entree[info.genre] || "";
      if (!formeTifinagh) continue;

      const formeLatine = translitterer(formeTifinagh);

      lignes += `
        <tr>
          <td class="personne">${info.label}</td>
          <td class="forme-latin" data-label="Latin">${formeLatine}</td>
          <td class="forme-tifinagh" data-label="Tifinagh">${formeTifinagh}</td>
        </tr>`;
    }
  } else {
    for (const info of Object.values(PERSONNES)) {
      const entree = data[info.cle];
      if (!entree) continue;

      let formeTifinagh = "";

      if (typeof entree === "object" && entree !== null) {
        if (info.genre) {
          formeTifinagh = entree[info.genre] || "";
        } else {
          formeTifinagh = entree.m || entree.f || "";
        }
      } else if (typeof entree === "string") {
        formeTifinagh = entree;
      }

      if (!formeTifinagh) continue;

      const formeLatine = translitterer(formeTifinagh);

      lignes += `
        <tr>
          <td class="personne">${info.label}</td>
          <td class="forme-latin" data-label="Latin">${formeLatine}</td>
          <td class="forme-tifinagh" data-label="Tifinagh">${formeTifinagh}</td>
        </tr>`;
    }
  }

  if (!lignes) {
    return `<div class="message-erreur">
      Aucune forme disponible pour ce thème.
    </div>`;
  }

  return `
    <table class="tableau-conj">
      <thead>
        <tr>
          <th>Personne</th>
          <th>Translittération latine</th>
          <th>Tifinagh</th>
        </tr>
      </thead>
      <tbody>${lignes}</tbody>
    </table>`;
}

/* =====================================================================
   ACCUEIL
   ===================================================================== */
function afficherAccueil() {
  document.getElementById("zone-resultat").innerHTML = `
    <div class="accueil">
      <div class="icone">📖</div>
      <h2>Sélectionnez un verbe dans l'index</h2>
      <p>
        Utilisez la barre de recherche
        <span id="hint-mobile" style="display:none;">(bouton ☰ en haut à gauche)</span>
        pour filtrer les verbes par traduction française, translittération
        latine ou Tifinagh, puis cliquez sur un verbe pour afficher sa
        conjugaison complète.
        <br><br>
        <em>Astuce :</em> la recherche ignore les emphases (points souscrits).
        Tapez <code>tt</code> pour trouver <code>ṭṭ</code>,
        <code>adf</code> pour <code>aḍf</code>, etc.
      </p>
    </div>`;

  if (window.matchMedia("(max-width: 900px)").matches) {
    document.getElementById("hint-mobile").style.display = "inline";
  }
}

/* =====================================================================
   GESTION DE LA SIDEBAR MOBILE
   ===================================================================== */
function ouvrirSidebar() {
  document.getElementById("sidebar").classList.add("ouvert");
  document.getElementById("overlay").classList.add("visible");
  document.body.style.overflow = "hidden";
}

function fermerSidebar() {
  document.getElementById("sidebar").classList.remove("ouvert");
  document.getElementById("overlay").classList.remove("visible");
  document.body.style.overflow = "";
}

/* =====================================================================
   ÉCOUTEURS
   ===================================================================== */
document.addEventListener("DOMContentLoaded", () => {
  chargerDataset();

  const input = document.getElementById("recherche");
  let timeout;
  input.addEventListener("input", () => {
    clearTimeout(timeout);
    timeout = setTimeout(filtrerVerbes, 150);
  });

  // Bouton menu mobile
  document.getElementById("btn-menu").addEventListener("click", ouvrirSidebar);
  document.getElementById("overlay").addEventListener("click", fermerSidebar);

  // Fermer la sidebar avec Échap (clavier / desktop)
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") fermerSidebar();
  });

  // Repositionner l'état si on change de taille d'écran
  window.addEventListener("resize", () => {
    if (window.matchMedia("(min-width: 901px)").matches) {
      fermerSidebar();
    }
  });
});
</script>
